<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Dinheiro Organizado - Contatos</title>
    <meta name="description"
        content="Entre em contato com Dinheiro Organizado para dúvidas sobre educação financeira" />
    <link rel="stylesheet" href="globals_Contatos.css" />
    <link rel="stylesheet" href="styleguide_Contatos.css" />
    <link rel="stylesheet" href="style_Contatos.css" />
</head>

<body>
    <div class="pgina-contatos">
        <header class="headline">
            <div class="frame">
                <div class="div">
                    <div class="group" role="img" aria-label="Logo Dinheiro Organizado">
                        <img class="vector" src="img/Vector-2.png" />
                        <img class="img" src="img/Vector 1 (1).png" />
                        <img class="vector-2" src="img/Vector 1.png" />
                    </div>
                    <div class="text-wrapper">DINHEIRO ORGANIZADO</div>
                </div>
                <nav class="buttons" aria-label="Navegação principal">
                    <a href="#" class="div-wrapper" aria-label="Início">
                        <div class="frame-2">
                            <div class="text-wrapper-2">INÍCIO</div>
                        </div>
                    </a>
                    <a href="#" class="div-wrapper" aria-label="Conceitos">
                        <div class="IN-CIO">CONCEITOS</div>
                    </a>
                    <a href="#" class="div-wrapper" aria-label="Dicas">
                        <div class="IN-CIO-2">DICAS</div>
                    </a>
                    <a href="index.html" class="IN-CIO-wrapper" aria-label="Contatos" aria-current="page">
                        <div class="IN-CIO-3">CONTATOS</div>
                    </a>
                </nav>
            </div>
        </header>
        <main class="frame-3">
            <h1 class="text-wrapper-3">ENTRE EM CONTATO</h1>
            <form class="contact-form" action="#" method="post" novalidate>
                <div class="form-row">
                    <div class="frame-4">
                        <label for="nome" class="visually-hidden">Seu nome</label>
                        <input type="text" id="nome" name="nome" class="text-wrapper-4" placeholder="Seu nome" required
                            aria-required="true" />
                    </div>
                    <div class="frame-5">
                        <label for="email" class="visually-hidden">Seu e-mail</label>
                        <input type="email" id="email" name="email" class="text-wrapper-5" placeholder="Seu e-mail"
                            required aria-required="true" />
                    </div>
                </div>
                <div class="frame-6">
                    <label for="assunto" class="visually-hidden">Assunto</label>
                    <input type="text" id="assunto" name="assunto" class="text-wrapper-6" placeholder="Assunto" required
                        aria-required="true" />
                </div>
                <div class="frame-7">
                    <label for="mensagem" class="visually-hidden">Digite sua mensagem</label>
                    <textarea id="mensagem" name="mensagem" class="text-wrapper-7" placeholder="Digite sua mensagem"
                        required aria-required="true" rows="6"></textarea>
                </div>
                <button type="submit" class="BOTAOENVIAR">
                    <span class="text-wrapper-8">ENVIAR</span>
                </button>
            </form>
        </main>
        <footer class="footer">
            <div class="group-2" role="img" aria-label="Logo Dinheiro Organizado">
                <img class="vector" src="img/Vector-2.png" />
                <img class="img" src="img/Vector 1 (1).png" />
                <img class="vector-2" src="img/Vector 1.png" />
            </div>
            <nav class="button-list" aria-label="Redes sociais">
                <a href="#" class="logo-instagram" aria-label="Instagram" target="_blank" rel="noopener noreferrer"></a>
            </nav>
            <a href="#" aria-label="WhatsApp" target="_blank" rel="noopener noreferrer">
                <img class="pngaaa-com" src="img/whattsapp.png" alt="WhatsApp" />
            </a>
            <p class="p">© 2025 - Desenvolvido por Evanilson Pinheiro, Mirian Menezes e Vitória Shailia</p>
        </footer>
    </div>
</body>

</html>
